name: ci
on:
  pull_request:
  push:
    branches:
      - v5.x.x
    tags:
      - v*
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.86.0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install formatter
        run: rustup toolchain install nightly-2026-10-29 --profile minimal --component rustfmt

      - name: Check Formatting
        run: cargo +nightly-2026-10-29 fmt --all -- --check

  # Runs `cargo check` on each individual crate in the `crates` directory.
  #
  # This is required because the other commands build on the workspace level,
  # or bring in `dev-dependencies` via the `test` target and it is possible
  # for a crate to compile successfully in those cases, but fail when compiled
  # on its own.
  #
  # Specifically, this happens where a dependency is missing features, but
  # when building as part of the workspace or together with a `dev-dependency`
  # those features are brought in via feature unification with another
  # crate.
  #
  # When publishing, `cargo publish` will run a `check` on the individual
  # crate being released. So this check is intended to catch any errors that
  # may occur there, but otherwise would not be caught by the `test` and
  # `clippy` commands which operate on the workspace and enable all targets.
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,clippy --target wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Check each crate
        run: |
          for crate in ./crates/*/; do
            echo "Checking $crate";
            cargo check --locked --manifest-path "${crate}/Cargo.toml";
          done

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,clippy --target wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Clippy with features
        run: cargo clippy --locked --profile debug-ci --all-features --all-targets -- -D warnings

      - name: Clippy without features
        run: cargo clippy --locked --profile debug-ci --all-targets -- -D warnings

  build-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-15"]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,clippy --target wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Install nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
          fallback: none

      - name: Build and archive tests
        run: cargo nextest archive --locked --cargo-profile debug-ci --workspace --all-features --archive-file nextest-archive-${{ matrix.os }}.tar.zst
      - name: Upload archive to workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-archive-${{ matrix.os }}
          path: nextest-archive-${{ matrix.os }}.tar.zst

  run-tests:
    needs: build-tests
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-15"]
        partition: [1, 2]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,clippy --target wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Install nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
          fallback: none

      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive-${{ matrix.os }}

      - name: Run tests
        run: cargo nextest run --archive-file nextest-archive-${{ matrix.os }}.tar.zst --partition count:${{ matrix.partition }}/2 -E 'not (test(integration_tests) | package(contract-build))'

      - name: Run contract build tests
        # The contract build tests cannot be run in parallel
        run: cargo nextest run --archive-file nextest-archive-${{ matrix.os }}.tar.zst --partition count:${{ matrix.partition }}/2 -j 1 -E 'package(contract-build)'

  run-integration-test:
    needs: build-tests
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-15"]
        partition: [1, 2]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,clippy --target wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Install nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest@0.9.150
          fallback: none

      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive-${{ matrix.os }}

      - name: Install ink v5 contracts node
        env:
          CONTRACTS_NODE_URL: https://github.com/paritytech/substrate-contracts-node/releases/download/v0.42.0/substrate-contracts-node-
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
              CONTRACTS_NODE_OS=linux
          elif [ "$RUNNER_OS" == "macOS" ]; then
              CONTRACTS_NODE_OS=mac-universal
          else
              echo "$RUNNER_OS not supported"
              exit 1
          fi
          curl --fail --location --retry 3 -o substrate-contracts-node.tar.gz "$CONTRACTS_NODE_URL$CONTRACTS_NODE_OS.tar.gz"
          tar xfzv substrate-contracts-node.tar.gz
          chmod +x artifacts/substrate-contracts-node-*/substrate-contracts-node &&
          mv artifacts/substrate-contracts-node-*/substrate-contracts-node /usr/local/bin
        shell: bash

      - name: Run integration tests
        # The integration tests cannot be run in parallel
        run: cargo nextest run --archive-file nextest-archive-${{ matrix.os }}.tar.zst --partition count:${{ matrix.partition }}/2 -j 1 -E 'test(integration_tests)'

  template:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-15", "windows-2022"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install toolchains
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,clippy --target wasm32-unknown-unknown
          rustup toolchain install nightly-2024-09-05 --profile minimal --component rust-src,rustc-dev,llvm-tools-preview

      - name: Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Install ink v5 linter
        run: cargo install cargo-dylint dylint-link --version 4.0.1 --locked

      - name: Check Template
        run: |
          cargo -vV
          cargo run --locked --profile debug-ci -- contract --version
          cargo run --locked --profile debug-ci -- contract new --target-dir "$RUNNER_TEMP" foobar
          cargo run --locked --profile debug-ci -- contract build --lint --manifest-path="$RUNNER_TEMP/foobar/Cargo.toml"
          cargo run --locked --profile debug-ci -- contract check --manifest-path="$RUNNER_TEMP/foobar/Cargo.toml"
          cargo run --locked --profile debug-ci -- contract build --manifest-path="$RUNNER_TEMP/foobar/Cargo.toml" --release
          cargo test --manifest-path="$RUNNER_TEMP/foobar/Cargo.toml"
